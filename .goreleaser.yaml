# GoReleaser config for kraai (docs/BLUEPRINT.md D1). No release-triggering
# workflow exists yet (that's a future workstream once cosign/GH credentials
# are in place) — this file is validated locally via `goreleaser release
# --snapshot --clean` for now. See the go-module-scaffold PR description for
# exactly what's stubbed pending real credentials.
version: 2

project_name: kraai

before:
  hooks:
    - go mod tidy

builds:
  - id: kraai
    main: ./cmd/kraai
    binary: kraai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/evatt-labs/kraai/internal/cli.version={{ .Version }}
      - -X github.com/evatt-labs/kraai/internal/cli.commit={{ .Commit }}
      - -X github.com/evatt-labs/kraai/internal/cli.date={{ .Date }}

archives:
  - id: kraai-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# Keyless cosign signing (Sigstore, OIDC-based — no key material stored in
# this repo). config.Sign has no per-run `skip` field, so this pipe always
# runs when GoReleaser executes; there's no OIDC identity or cosign binary
# available outside a real GitHub Actions run, so local/CI verification of
# this scaffolding uses `goreleaser release --snapshot --clean --skip=sign`.
# STUBBED: untested end-to-end pending a release workflow that installs
# cosign and grants `id-token: write` for keyless signing.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  github:
    owner: evatt-labs
    name: kraai

# STUBBED: evatt-labs/homebrew-tap does not exist yet. Publishing is
# skipped for snapshot builds regardless, but a real release will fail here
# until that tap repo is created and a token with push access to it is
# wired into the (not-yet-existing) release workflow. `brews:` (formulas)
# is deprecated as of GoReleaser v2.16 in favor of `homebrew_casks:`.
homebrew_casks:
  - name: kraai
    repository:
      owner: evatt-labs
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/evatt-labs/kraai
    description: kraai is a multi-cloud devops control plane.
