name: Dependency Review

# pull_request, not pull_request_target: this needs no secrets, and a
# fork's PR should be checked the same way as any other PR. Never widen
# this to pull_request_target — see publish.yml for why that trigger is
# dangerous once real permissions are in scope.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
