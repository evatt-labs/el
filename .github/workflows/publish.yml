name: Publish

# Tag push, plus a manual escape hatch — never `pull_request` or
# `pull_request_target`. This is the single most load-bearing part of
# this file: a trigger an external contributor could influence (a PR
# event, or a workflow_dispatch that accepted an arbitrary ref as input)
# would mean a fork's code running with publish credentials in scope.
# workflow_dispatch below takes no inputs: it can only run against a ref
# the person dispatching it explicitly picks, and dispatching it at all
# already requires write access to this repo, same trust level as
# pushing the tag. It exists to recover a release whose tag push didn't
# trigger this workflow (e.g. tagged by a token GitHub doesn't chain
# workflow runs from) without deleting and recreating the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # First publish must be done manually (`npm publish --provenance
    # --access public`, from an authenticated npm account with 2FA) —
    # trusted publishing is configured on an EXISTING package's settings
    # page on npmjs.com, so there is no way for this workflow to bootstrap
    # its own trust. After that one manual publish, add this repo +
    # workflow filename as a trusted publisher for @evatt-labs/el on
    # npmjs.com (or `npm trust github`), and every push of a `v*` tag from
    # here on publishes with no stored token at all.
    #
    # Every `v*` tag here comes from release-please-action (see
    # release-please.yml), which also already created the GitHub Release
    # this job attaches the npm tarball to. contents: write below is only
    # for that upload, scoped to the same trusted-tag-push boundary as
    # everything else in this job.
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prevents a compromised dependency's install/lifecycle script
          # from reading GITHUB_TOKEN out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # No lifecycle scripts today (see package.json) — keep it that way,
      # and --ignore-scripts means a future dependency doesn't get to add
      # one silently.
      - run: npm ci --ignore-scripts
      - run: npm test

      # id-token: write below is what lets npm exchange this job's OIDC
      # token for a short-lived publish credential — no NPM_TOKEN secret
      # exists in this repo at all. --provenance is redundant with what
      # trusted publishing already does automatically for a public package
      # from a public repo, but it's cheap to be explicit about intent.
      - run: npm publish --provenance

      # Same tree npm just published from, packed the same way npm itself
      # would — not a separate "build," since there's nothing to compile.
      - name: Pack tarball
        id: pack
        run: echo "tarball=$(npm pack)" >> "$GITHUB_OUTPUT"

      # This is separate from the SLSA attestation npm's trusted publishing
      # already generated above: that one lives on the npm registry, tied
      # to the package. This one is a GitHub-native attestation for the
      # exact same tarball, needed because the GitHub Release itself has no
      # signed/provenance-carrying asset otherwise. bundle-path is copied
      # to an explicit .sigstore.json name below since that's one of the
      # few extensions recognized as a signed-release artifact by tooling
      # that scans release assets rather than checking GitHub's
      # attestation API directly.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      # Attaches to the GitHub Release release-please already created for
      # this tag (see release-please.yml); --clobber makes a rerun of this
      # job idempotent instead of failing on a duplicate asset.
      - name: Attach tarball and provenance to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.tarball }}.sigstore.json"
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.pack.outputs.tarball }}" \
            "${{ steps.pack.outputs.tarball }}.sigstore.json" \
            --clobber --repo "${{ github.repository }}"
