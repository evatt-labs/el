name: el preview environment
description: One ephemeral Cloudflare Workers environment per pull request, torn down on close.

inputs:
  mode:
    description: >-
      auto (default), up, or down. auto resolves to down when the pull
      request event's action is "closed", otherwise up.
    required: false
    default: auto
  name:
    description: >-
      Explicit environment name, overriding the one derived from the repo
      name and pull request number. Must match el's name grammar
      (word-word-word-NNNNN).
    required: false
    default: ""
  working-directory:
    description: Directory containing el.config.mjs.
    required: false
    default: "."
  comment:
    description: Whether to post or update a sticky pull request comment with the environment's URLs.
    required: false
    default: "true"
  github-token:
    description: Token used only to post or update the pull request comment.
    required: false
    default: ${{ github.token }}

outputs:
  name:
    description: The environment name used for this run.
    value: ${{ steps.name.outputs.name }}
  urls:
    description: The JSON object el up wrote via --output (name, urls, summary, seed), as a string. Only set in up mode.
    value: ${{ steps.up.outputs.urls }}
  mode:
    description: The resolved mode, up or down.
    value: ${{ steps.mode.outputs.mode }}

runs:
  using: composite
  steps:
    # This runs before anything else. pull_request_target checks out
    # untrusted fork code while running with repository secrets in scope,
    # and el.config.mjs is arbitrary Node code that runs with whatever
    # credentials the job has. See the Trust model section in el's README
    # for the full reasoning; this step just enforces it.
    - name: Refuse pull_request_target
      if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        set -euo pipefail
        echo "::error::el does not support pull_request_target. This event checks out untrusted fork code while the job still has repository secrets in scope, and el.config.mjs is arbitrary Node code that runs with those credentials. Use pull_request instead: forked PRs receive no repository secrets there by default. See el's README, Trust model section."
        exit 1

    - name: Require a pull_request event
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        echo "::error::el's GitHub Action only supports the pull_request event (got \"$EVENT_NAME\"). Wire it into a workflow triggered by pull_request, not push, workflow_dispatch, or pull_request_target."
        exit 1

    - name: Resolve mode
      id: mode
      shell: bash
      env:
        MODE_INPUT: ${{ inputs.mode }}
        EVENT_ACTION: ${{ github.event.action }}
      run: |
        set -euo pipefail
        case "$MODE_INPUT" in
          up|down)
            resolved="$MODE_INPUT"
            ;;
          auto|"")
            if [ "$EVENT_ACTION" = "closed" ]; then
              resolved="down"
            else
              resolved="up"
            fi
            ;;
          *)
            echo "::error::Unknown mode \"$MODE_INPUT\" (expected auto, up, or down)."
            exit 1
            ;;
        esac
        echo "mode=$resolved" >> "$GITHUB_OUTPUT"

    - name: Resolve name
      id: name
      shell: bash
      env:
        NAME_INPUT: ${{ inputs.name }}
        REPO_NAME: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ -n "$NAME_INPUT" ]; then
          resolved="$NAME_INPUT"
        else
          resolved="$(node --input-type=module -e "import { environmentNameForPullRequest } from '${GITHUB_ACTION_PATH}/src/names.mjs'; console.log(environmentNameForPullRequest(process.argv[1], Number(process.argv[2])))" -- "$REPO_NAME" "$PR_NUMBER")"
        fi
        echo "name=$resolved" >> "$GITHUB_OUTPUT"

    # A fork PR gets no repository secrets by default, so CLOUDFLARE_API_TOKEN
    # is empty in that case. The consumer's workflow passes secrets via env:
    # on the `uses:` step that invokes this action; that's what populates
    # this variable when it's present at all.
    - name: Check for Cloudflare credentials
      id: creds
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
          echo "::notice::el: no CLOUDFLARE_API_TOKEN in the environment (a fork PR receives no repository secrets); skipping."
          echo "skipped=true" >> "$GITHUB_OUTPUT"
        else
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        fi

    # Runs in both modes. In up mode this is the re-run strategy: every push
    # tears down whatever the last run for this PR left, then up (below)
    # provisions a fresh one. It's noisy on a PR's first push, since there's
    # nothing to tear down yet (el warns and continues); that's expected, not
    # a failure. In down mode this is the actual teardown, so its exit code
    # propagates instead of being swallowed.
    - name: Down
      id: down
      if: steps.creds.outputs.skipped != 'true'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        NAME: ${{ steps.name.outputs.name }}
        MODE: ${{ steps.mode.outputs.mode }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        if [ "$MODE" = "down" ]; then
          node "${GITHUB_ACTION_PATH}/bin/el.mjs" down "$NAME"
        else
          node "${GITHUB_ACTION_PATH}/bin/el.mjs" down "$NAME" || echo "::warning::el down reported errors (expected when no environment exists yet)"
        fi

    - name: Up
      id: up
      if: steps.creds.outputs.skipped != 'true' && steps.mode.outputs.mode == 'up'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        NAME: ${{ steps.name.outputs.name }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        node "${GITHUB_ACTION_PATH}/bin/el.mjs" up "$NAME" --output "$RUNNER_TEMP/el-result.json" --no-open
        {
          echo "urls<<EL_RESULT_EOF"
          cat "$RUNNER_TEMP/el-result.json"
          echo "EL_RESULT_EOF"
        } >> "$GITHUB_OUTPUT"

    # A convenience, not the product: a failure here warns and moves on
    # rather than failing the job. The comment call needs `gh`, present by
    # default on GitHub-hosted runners.
    - name: Sticky pull request comment
      if: inputs.comment == 'true' && steps.creds.outputs.skipped != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MODE: ${{ steps.mode.outputs.mode }}
        NAME: ${{ steps.name.outputs.name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RESULT_FILE: ${{ runner.temp }}/el-result.json
      run: |
        set -euo pipefail
        MARKER="<!-- el-preview -->"
        BODY_FILE="$(mktemp)"

        if [ "$MODE" = "up" ] && [ -f "$RESULT_FILE" ]; then
          {
            echo "$MARKER"
            echo "## el preview environment"
            echo
            echo "**Environment:** \`$NAME\`"
            echo
            jq -r '.urls | to_entries[] | "- **\(.key)**: \(.value)"' "$RESULT_FILE"
            jq -r '.summary[]? | "- \(.)"' "$RESULT_FILE"
            echo
            echo "Head SHA: \`$HEAD_SHA\`"
            echo
            echo "This environment is torn down automatically when the pull request closes."
          } > "$BODY_FILE"
        else
          {
            echo "$MARKER"
            echo "## el preview environment"
            echo
            echo "**Environment:** \`$NAME\`"
            echo
            echo "Torn down."
            echo
            echo "Head SHA: \`$HEAD_SHA\`"
          } > "$BODY_FILE"
        fi

        existing_id="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty" || true)"

        if [ -n "$existing_id" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing_id" -F body=@"$BODY_FILE" || \
            echo "::warning::el: failed to update the pull request comment (continuing, the environment is the product, the comment is a convenience)"
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$BODY_FILE" || \
            echo "::warning::el: failed to post the pull request comment (continuing, the environment is the product, the comment is a convenience)"
        fi
