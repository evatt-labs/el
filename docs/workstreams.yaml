# Machine-readable companion to BLUEPRINT.md (Go rewrite). Order is the
# dependency order. Each workstream is one PR implemented by a Sonnet
# subagent, reviewed by Jordan before merge, live-smoked where `smoke` is
# set. Supersedes the archived Node-era workstreams entirely (removed; see
# `git log -- docs/archive/node-cli`).
#
# status: proposed | in-progress | done
# depends: workstream ids that must be merged first

version: 1

workstreams:
  - id: go-module-scaffold
    title: Go module, Cobra CLI skeleton, GoReleaser, CI
    status: done
    depends: []
    decisions: [D1, D20]
    scope:
      - >-
        `go.mod` (module github.com/evatt-labs/kraai), Go version floor
        matching current stable minus one.
      - >-
        `cmd/kraai/main.go` — thin entrypoint, Cobra root command, no
        business logic. `internal/cli/` holds command wiring; `internal/`
        holds everything else per D20.
      - >-
        `.goreleaser.yaml`: cross-platform builds, checksums, cosign or
        GPG signing, GitHub Releases, Homebrew tap.
      - >-
        `npm/` — thin postinstall-wrapper package (name `kraai`) that
        downloads the matching GoReleaser binary; keeps `npx kraai`
        working. Does not republish the existing JS package's version
        line; coordinate the npm version bump separately before this ships.
      - >-
        CI: `go test ./...`, `go vet`, `golangci-lint` (or similar),
        coverage upload to the existing codecov integration, on every PR.
    acceptance:
      - >-
        `go build ./...` succeeds; `kraai --help` runs and prints Cobra's
        generated help with no subcommands wired yet beyond a placeholder.
      - >-
        A tagged test release via GoReleaser's `--snapshot` mode produces
        binaries for at least linux/amd64, linux/arm64, darwin/arm64.
    smoke: false

  - id: errors-package
    title: cockroachdb/errors-based error types, exit codes, centralized handler
    status: done
    depends: [go-module-scaffold]
    decisions: [D18, D19]
    scope:
      - >-
        `internal/kerrors/`: base error type wrapping `cockroachdb/errors`,
        one typed error per D19 exit-code bucket (validation, lock-held,
        confirmation-required), each exposing a fixed `ExitCode()`.
      - >-
        `cmd/kraai/main.go`'s single centralized handler: catches the
        returned error, prints the wrapped-message chain (no stack)
        normally, the full stack via `%+v` when `KRAAI_DEBUG=1` or
        `--debug` is set, and calls `os.Exit` with the matched code
        (default `1` for anything unrecognized).
      - >-
        Lint rule or code-review checklist item: no package other than
        `cmd/kraai` may call `os.Exit`, `fmt.Print*` to stdout/stderr for
        error presentation, or read `KRAAI_DEBUG` directly.
    acceptance:
      - >-
        Every exit code in D19's table has a test asserting the mapping
        from error type to process exit code.
      - >-
        `KRAAI_DEBUG=1` and `--debug` each independently trigger stack
        output; neither alone when unset does.
    smoke: false

  - id: manifest-loader
    title: Directory-based manifest loader, Jinja2 templating, values precedence
    status: done
    depends: [errors-package]
    decisions: [D3, D4, D5, D25]
    scope:
      - >-
        `internal/manifest/`: load `kraai.yaml` + glob `services/*.yaml`
        (and `.yaml.j2` variants), merge into one resolved manifest.
      - >-
        Template rendering via `flosch/pongo2` v6.1.0 (D25 — decided, no
        longer a choice inside this workstream) only for `.j2`-suffixed
        files; render happens before YAML parsing, and the rendered output
        still goes through full schema validation afterward — a bad render
        must fail loudly, not silently.
      - >-
        `environments/<name>.values.yaml` loaded as free-form data (no
        schema), `--set key.path=value` CLI flags merged on top with
        Helm's exact precedence and dotted-path syntax.
      - >-
        Unknown keys reject at every level of the *schema-validated* files
        (`kraai.yaml`, `services/*.yaml`, `environments/*.yaml`), with the
        failing path in the error. Values files are exempt (D5).
    acceptance:
      - >-
        Every example in BLUEPRINT.md's Manifest schema section parses.
      - >-
        A `.j2` file with a template error fails at render time, not
        silently producing wrong YAML; a rendered-but-schema-invalid
        result fails validation with the same clear path-based errors as
        a hand-written file would.
      - >-
        `--set` overrides a value from `<name>.values.yaml`, which
        overrides a template default, in that order, by test.
    smoke: false

  - id: naming-policy
    title: Deterministic naming, frozen ephemeral grammar
    status: done
    depends: [manifest-loader]
    decisions: [D7, D22]
    scope:
      - >-
        Port `NAME_PATTERN`, `generateEnvironmentName`,
        `environmentNameForPullRequest`, and `resourceName()` from 0.5.0
        JS byte-for-byte in behavior (not code) — same regex, same
        `-pull-request-` infix, same output shape.
      - >-
        Persistent name grammar: `/^[a-z][a-z0-9-]{0,30}[a-z0-9]$/`.
      - >-
        Import reference resolution: given `resources.<svc>.<type>.<binding>:
        { id | name }` in an overlay, that's the resource's identity —
        no further derivation.
    acceptance:
      - >-
        Property-based test (`rapid`) generating environment/service/binding
        strings, asserting the derived name always matches the frozen
        pattern and is stable (same inputs, same output, every call).
      - >-
        Golden-value tests comparing specific inputs against the exact
        0.5.0 JS outputs for at least a dozen real examples pulled from
        that codebase's own test fixtures.
    smoke: false

  - id: plugin-runtime
    title: wazero WASM plugin loader and registry, raw host-function ABI
    status: done
    depends: [manifest-loader]
    decisions: [D3, D16, D28, D29]
    findings:
      - >-
        RESEARCHED + BENCHMARKED 2026-09-13; full numbers in BLUEPRINT.md's
        measurement appendix. ABI decided as D28 (raw wazero host functions
        over linear memory) — Extism, waPC, WASI-P1 stdio and the Component
        Model were all evaluated and rejected. The Component Model is not
        available at all: wazero ships only wasi_snapshot_preview1 and
        claims Core Spec 1.0/2.0. Extism and waPC were rejected on the
        staleness of the exact component kraai would import, not on
        ergonomics.
      - >-
        Per-call overhead is 56ns warm — a non-issue. The costs that
        actually shape this design are compile time (391ms cold for a
        1.86MB module, linear at ~440ns/byte) and instantiation (2.5ms),
        not invocation.
    scope:
      - >-
        `internal/plugin/`: load each `plugins:` entry (a `.wasm` file path
        or a resolvable package reference — resolution mechanism is part of
        this workstream's design, not assumed) via `wazero`, validate its
        exported ABI.
      - >-
        D28 ABI: the guest exports an allocation entrypoint plus its
        capability functions; the host writes arguments into the guest's
        linear memory and passes (ptr, len), reading results back the same
        way. Define and document this contract explicitly as the
        third-party extension surface (D20) — it is a compatibility
        promise, so version it from the first commit.
      - >-
        D29: build the runtime with `wazero.NewCompilationCacheWithDir`,
        never the in-memory `NewCompilationCache()`, and never
        compile-per-invocation. Compile once per plugin, then pool
        instances — module instances are NOT goroutine-safe, and pooling
        measured 19.2us -> 4.3us going from one instance to sixteen at a
        16KB payload. Size the pool against D13's global concurrency limit.
      - >-
        Registry assembled from built-ins (compiled into the binary, not
        loaded as plugins) plus the project's own `plugins:` list, in
        declared order. A later registration for the same provider
        capability/resource-type key/backend name overrides an earlier one,
        logging a warning naming the overriding plugin.
      - >-
        Host-capability wiring: a documented, minimal set of host functions
        a WASM plugin may import (e.g. an HTTP-call capability), explicitly
        granted, never ambient. Nothing is reachable by default.
      - >-
        Host-capability egress: a capability runs with the host's network
        identity while the plugin picks the request, so HTTPCapability
        guards at dial time against the resolved IP — link-local (cloud
        instance metadata), loopback, RFC1918, CGNAT, and the IPv4-mapped
        IPv6 / NAT64 / 6to4 spellings of each. Checking the URL string
        instead would be defeated by a redirect, a rebinding DNS answer,
        or an `http://[::ffff:169.254.169.254]/` literal, all of which
        dial. A deny of infrastructure, not an allowlist of destinations:
        which public hosts a plugin may reach is manifest policy, left
        open deliberately.
      - >-
        Answer open question 3 (does "middleware" survive as a distinct
        concept from "a plugin with hooks") as part of this design, not
        deferred past it.
      - >-
        D16 resource bounds: build the runtime with
        `WithMemoryLimitPages` and `WithCloseOnContextDone(true)`.
        wazero's defaults are the wasm32 ceiling (65536 pages / 4GiB per
        instance, times the pool size) and no in-guest ctx observation at
        all, so an unbounded `memory.grow` or a bare `loop br 0` in a
        guest takes the host's memory or pins a goroutine and its OS
        thread forever. Neither limit is plugin-author-configurable: they
        are the host's trust boundary against code it did not write.
        `WithCloseOnContextDone` closes the interrupted instance, so the
        pool must replace a closed instance at borrow time rather than
        poisoning the slot.
    acceptance:
      - >-
        A minimal example WASM plugin (built as part of the test fixtures,
        any source language) round-trips through load -> register -> call
        -> produces output visible to the host.
      - >-
        A plugin attempting an unwired capability (e.g. raw filesystem
        access) fails, provably, in a test.
      - >-
        A plugin overriding a built-in wins, with a logged warning;
        removing it restores the built-in.
      - >-
        A benchmark asserts warm per-call overhead stays in the tens of
        nanoseconds, and a test proves the on-disk compilation cache is
        actually being hit on a second run rather than silently recompiling
        (D29's whole point, and the in-memory-cache trap makes a silent
        regression here easy).
      - >-
        A plugin cannot exhaust host memory or CPU: tests prove a guest
        growing past the memory limit is refused, a guest declaring a
        minimum above it fails instantiation, a never-returning guest is
        terminated by Invoke's ctx, and the pool recovers the instance
        that termination closed. Every one of these probes is bounded by
        construction — a two-page limit and a 150ms deadline, never
        "allocate or spin until the machine stops it."
      - >-
        A plugin cannot abort the host process by re-entering it: a guest
        whose `kraai_alloc` calls a host capability closes a
        hostCapabilityFunc -> placeEnvelope -> placeInGuestMemory ->
        kraai_alloc cycle on the caller's goroutine. Measured against a
        deliberately-lowered 8MiB stack this produced `fatal error: stack
        overflow` (exit 2) — fatal, so unrecoverable by `recover()`, and
        growing host stack no WASM memory limit governs. Bounded by
        MaxHostCallDepth, with a control test proving shallow re-entry
        still works.
      - >-
        A plugin binary larger than MaxPluginBytes is refused before it
        reaches the compiler: reading and compiling the .wasm is the one
        part of loading that happens entirely outside the sandbox, at a
        cost linear in file size.
      - >-
        A plugin granted the HTTP capability cannot reach cloud instance
        metadata or any internal address: tests cover every blocked range
        including the IPv4-mapped IPv6, NAT64 and 6to4 spellings, prove a
        live loopback listener is refused where an unguarded dialer
        reaches it, and prove the vetted IP (not the hostname) is what
        gets dialed, so there is no rebinding window. Non-http(s) schemes
        are refused before any dialer sees them.
    smoke: false

  - id: resource-contract-and-telemetry
    title: Per-verb Resource interface, registry, OTel decorator, mocks
    status: done
    depends: [plugin-runtime]
    decisions: [D15, D17, D21, D30, D31, D32, D33]
    scope:
      - >-
        `internal/resource/`: the `Resource` interface (`Get`/`Create`/
        `Update`/`Delete`), a `provider/type`-keyed registry combining
        plugin-runtime's registrations with compiled-in built-ins.
      - >-
        Decorator wrapping every registered `Resource` at registration
        time: an OTel span + duration histogram per verb call, `otelhttp`
        on the shared HTTP client.
      - >-
        `//go:generate` directives + `go.uber.org/mock` for every
        interface in this package; generated mocks checked in or
        generated in CI (decide which, document it).
    acceptance:
      - >-
        A fake `Resource` registered, called through the decorator,
        produces a span and a histogram data point observable via the
        OTel SDK's in-memory test exporter — no real backend needed for
        the test.
      - >-
        100% coverage on this package, enforced in CI.
    smoke: false

  - id: lock-and-status
    title: Per-environment lock and status record, per-provider conditional writes
    status: proposed
    depends: [resource-contract-and-telemetry]
    decisions: [D10, D11]
    scope:
      - >-
        `internal/envstate/` (name deliberately not "state" — this holds
        no resource inventory): `Lock.Acquire`/`Release`/staleness check,
        `Status.Write`/`Read`/`List`, one interface, one implementation
        per provider's native conditional-write primitive. **AWS S3 first**
        (D24: AWS is the first POC target) — Cloudflare R2, Azure Blob, GCS
        follow as their own providers land, same interface, no change to it.
      - >-
        SigV4 via the official `aws-sdk-go-v2`, not hand-rolled signing.
    acceptance:
      - >-
        Two concurrent `Acquire` calls on the same environment: exactly
        one succeeds, the other gets the current holder's identity.
      - >-
        A lock past the staleness threshold is reclaimable via
        `--force-unlock`, and the reclaim is logged with the previous
        holder's identity.
      - >-
        `Status.Write` after `Status.Write` (no lock involved, per D11) is
        a plain last-writer-wins overwrite, by test — confirms no
        unnecessary CAS complexity was added here.
    smoke: true
    smoke_notes: >-
      Live against a real S3 bucket on the AWS account that will host the
      kraai SaaS substrate (D24) — this is the same account/bucket the
      dogfooding work eventually depends on, not a disposable fixture.

  - id: aws-provider-core
    title: AWS provider engine (Cloud Control API) + Tier 1 static-site resources
    status: proposed
    depends: [lock-and-status]
    decisions: [D6, D7, D8, D9, D17, D24, D26, D27]
    findings:
      - >-
        VERIFIED 2026-09-13 against the live Evatt Labs account
        (409032463870, us-east-1): D17's assumption holds. Every resource
        type kraai needs has a machine-readable CloudFormation resource
        provider schema via `cloudformation describe-type`, each carrying
        `properties`, `required`, `primaryIdentifier`, `createOnlyProperties`
        and per-verb `handlers` (create/read/update/delete/list). Schema
        sizes range 3KB (ACM Certificate) to 116KB (CloudFront
        Distribution). `createOnlyProperties` is directly useful to `plan`:
        it is the authoritative per-property answer to "does changing this
        force a replacement."
      - >-
        VERIFIED 2026-09-13: the **Cloud Control API** exposes uniform
        Get/Create/Update/Delete/List across **1,598 FULLY_MUTABLE public
        resource types**, and read-only `list-resources` probes succeeded
        for every Tier 1 and Tier 2 type below. This maps 1:1 onto D15's
        per-verb `Resource` interface. Consequence: this workstream builds
        ONE generic Cloud Control-backed `Resource` implementation driven
        by the fetched schema, NOT "one implementation per AWS primitive"
        as the superseded version of this entry said. Per-type work
        collapses to a registry entry plus schema-derived validation.
      - >-
        Real costs of the Cloud Control route, to design for rather than
        discover: it is asynchronous (operations return a ProgressEvent
        that must be polled to completion); `UpdateResource` takes a JSON
        Patch document, not a whole desired-state object, so the diff
        engine must emit patches; and IMMUTABLE-provisioning types
        (create/read/delete, no update) must be detected from the schema
        and surfaced as replace-or-fail rather than silently failing an
        update.
    resolved:
      - >-
        RESOLVED 2026-09-13 as D26 + D27. D7's derivable-name assumption
        held for only four of nine measured types, so identity lookup
        became a per-type declared strategy (`byName` / `byApi` / `byAttr`
        / `byTag`) rather than one global rule, and provider-assigned ids
        are held in an identity *cache* — never a record, never a diff
        source, self-healing on a miss via the type's fallback strategy.
    scope:
      - >-
        `internal/provider/aws/`: one generic `Resource` implementation
        backed by Cloud Control API, driven by CloudFormation resource
        provider schemas fetched/vendored per D17 (never hand-transcribed),
        with a `raw:` passthrough for properties kraai does not model.
      - >-
        Async operation handling: submit, poll the ProgressEvent to a
        terminal state, map failure reasons onto `kerrors` buckets.
      - >-
        Diff-to-JSON-Patch emission for `UpdateResource`, and
        schema-driven detection of `createOnlyProperties` /IMMUTABLE types
        so a forced replacement is explicit in `plan` output.
      - >-
        Per-type identity strategy per D26, declared on each registry
        entry: `byName` (S3 BucketName, Lambda FunctionName, SSM Name, IAM
        RoleName), `byApi` (Route53 `list-hosted-zones-by-name`), `byAttr`
        (CloudFront `Aliases` — AWS enforces global alias uniqueness),
        `byTag` (ACM, whose `DomainName` is not unique). A `byTag` type
        MUST carry its identity tag in the `CreateResource` desired state,
        never as a follow-up write, or a crash between the two orphans the
        resource unfindably.
      - >-
        Identity cache per D27: manifest path -> assigned id, for
        `byApi`/`byAttr`/`byTag` types only, never `byName` types. Treat
        every read as a cache hit that must still be verified by `Get`; on
        miss or mismatch fall back to the type's D26 strategy and
        repopulate. It is never a diff source and never stores attributes.
      - >-
        Tier 1 resource types registered: `AWS::S3::Bucket`,
        `AWS::CloudFront::Distribution`, `AWS::CertificateManager::Certificate`,
        `AWS::Route53::HostedZone`, `AWS::Route53::RecordSet`. This set is
        deliberately the subset that is needed in EVERY future for kraai.dev
        — full SaaS, OSS docs site, or a bare landing page — so it is
        buildable while the business model stays undecided.
    acceptance:
      - >-
        `Get` on a resource that doesn't exist returns a typed
        not-found result (not an error) that `plan` interprets as "needs
        creating."
      - >-
        Running the same manifest twice against a live account produces
        no creates on the second run.
      - >-
        A change to a `createOnlyProperties` field is reported by `plan` as
        a replacement, not an in-place update.
    smoke: true
    smoke_notes: >-
      Full round-trip (create, no-op re-run, update, delete) per resource
      type against the real AWS account. The dogfood milestone for this
      workstream is kraai deploying kraai.dev's own static site end to end
      — production-intended infrastructure, not a disposable fixture, so
      `protected: true` from day one.

  - id: per-service-compute
    title: Per-service compute configuration and trigger shape
    status: done
    depends: [plan-apply-destroy]
    decisions: [D34, D36]
    findings:
      - >-
        FOUND 2026-09-14 by running `kraai plan` against the real kraai-api
        manifest, not by review. Every service plans BOTH a Lambda and an
        API Gateway, because the AWS provider registers two types under the
        `compute` capability and D36 synthesises one compute resource per
        service for every registered type. `tick` is a scheduled worker
        with no HTTP surface at all, so its API Gateway is wrong output,
        not merely redundant.
      - >-
        The underlying gap is that `providers.compute.settings` is one blob
        shared by every service using the capability, while the two
        services genuinely differ: `api` needs a Web Adapter layer and HTTP
        triggering, `tick` needs neither and has its own handler path.
        First reported when the manifests were written, confirmed by the
        plan output.
      - >-
        Also observed in the same run: the AWS client takes its region from
        AWS_REGION rather than from `providers.compute.settings.region`,
        which the manifest already carries.
    scope:
      - >-
        A way for a service to say what shape it is - HTTP-facing versus
        invoked - so a compute vendor registers only the types that shape
        implies. Whether that is a field on Service, a second capability,
        or a condition like D36's is the design question.
      - >-
        Per-service compute settings, layered over the provider-level
        block rather than replacing it, so the common case stays one
        declaration.
      - >-
        Provider settings reaching the client: region from the manifest,
        not only the environment.
    acceptance:
      - >-
        `kraai plan` against kraai-api plans one Lambda for `tick` and no
        API Gateway, and both for `api`, driven by the manifest rather than
        by which types happen to be registered.
    smoke: false

  - id: aws-provider-compute
    title: AWS provider Tier 2 — Lambda/API resources (only if kraai-api exists)
    status: done
    depends: [aws-provider-core]
    decisions: [D24]
    scope:
      - >-
        Register Tier 2 resource types on the generic engine built in
        `aws-provider-core`: `AWS::Lambda::Function`, `AWS::Lambda::Url`,
        `AWS::IAM::Role`, `AWS::SSM::Parameter`, `AWS::Events::Rule`
        (chosen over EventBridge Scheduler — see the PR description). No
        new engine work — per-type registration plus schema-derived
        validation only.
      - >-
        Lambda artifact packaging: zip plus the Lambda Web Adapter layer
        (runs an unmodified ASGI app, so a later move to Fargate is a
        repackage rather than a rewrite), not a container image — no ECR
        cost, faster cold start. A per-service S3 artifact bucket
        (PhaseStorage, ahead of the function) holds the built zips;
        determinism is enforced and tested directly.
    blocked_on: >-
      Resolved: compute targets AWS Lambda (this workstream), so kraai.dev
      does have a hosted-API shape as of this PR. Whether kraai.dev ships
      one in production is still kraai-api's own call, not this
      document's.
    acceptance:
      - >-
        Same two acceptance criteria as aws-provider-core, for the Tier 2
        types.
    smoke: true
    smoke_notes: >-
      Only meaningful once kraai-api exists. kraai-api/docs/BLUEPRINT.md is
      stale and parked (it still documents Cloudflare Containers) — do not
      build against it without revising it first. This PR ships no live
      AWS smoke test (D21: no network, no AWS account in unit tests);
      smoke verification against a real kraai-api manifest is left to
      whoever builds kraai-api itself.

  - id: cloudflare-provider
    title: Built-in cloudflare provider — Worker, D1, KV, R2, Queues, Hyperdrive
    status: proposed
    depends: [lock-and-status]
    decisions: [D6, D7, D8, D9]
    scope:
      - >-
        `internal/provider/cloudflare/`: one `Resource` implementation per
        type, each `Get` doing a live lookup by deterministic name or
        import reference (never a stored ID), `Create`/`Update`/`Delete`
        against the Cloudflare API directly (no `wrangler` shell-out for
        resource CRUD — Worker *deploy* specifically may still need
        wrangler-equivalent bundling, see verify_first).
      - >-
        Per-resource schemas generated from wrangler's config schema /
        Cloudflare's OpenAPI, with a `raw:` passthrough.
    verify_first:
      - >-
        Whether Worker deployment (bundling + upload) can be done via the
        Cloudflare REST API directly with acceptable fidelity, or whether
        this workstream still needs to shell out to `wrangler` for that
        one step specifically.
    acceptance:
      - >-
        `Get` on a resource that doesn't exist returns a typed
        not-found result (not an error) that `plan` interprets as "needs
        creating."
      - >-
        Running the same manifest twice against a live account produces
        no creates on the second run.
    smoke: true
    smoke_notes: >-
      Full round-trip (create, no-op re-run, update, delete) per resource
      type against the real Evatt Labs Cloudflare account. Second-priority
      provider (D24) — not the dogfooding target.

  - id: plan-apply-destroy
    title: plan / apply / destroy verbs, two-phase execution, protected gating
    status: proposed
    depends: [aws-provider-core]
    decisions: [D12, D13, D14, D19]
    scope:
      - >-
        `plan`: get-by-identity every declared resource, diff, print,
        exit per D19's plan-specific convention. Never locks, never mutates.
      - >-
        `apply`/`destroy`: acquire lock (lock-and-status), run the
        two-phase pipeline (phase 1 backing resources concurrently
        bounded via `errgroup.SetLimit`, phase 2 per-service binder once
        that service's phase 1 is done), write the status record, release
        the lock.
      - >-
        `protected`/`--confirm-name` per D14, identical rule for both
        verbs, accepted-and-ignored on non-protected environments.
      - >-
        `destroy` deletes every currently-manifest-declared resource
        including imports (D8) — no special-casing.
    acceptance:
      - >-
        A manifest with 50+ synthetic resources across several services
        applies with measurably better wall-clock time than a purely
        sequential baseline, by test/benchmark.
      - >-
        `protected` prompts interactively; non-interactively requires
        `--confirm-name` matching exactly for both `apply` and `destroy`;
        neither has a bypass flag.
    smoke: true
    smoke_notes: >-
      Persistent `dev`-equivalent environment applied twice, then
      destroyed, against the real account.

  - id: cli-status-and-gc
    title: kraai status and kraai gc
    status: proposed
    depends: [plan-apply-destroy]
    decisions: [D11]
    scope:
      - >-
        `kraai status [<name>]` reading lock-and-status's `Status.Read`/`List`.
      - >-
        `kraai gc [--dry-run]`: `ttl` stored as an absolute deadline at
        apply time, refreshed on every apply; destroys elapsed ephemeral
        environments only, never persistent ones.
    acceptance:
      - >-
        `gc` never touches a `kind: persistent` environment, by test, even
        if one somehow carried a `ttl` (which manifest validation should
        already reject).
    smoke: true

  - id: github-action-go
    title: Rewrite the GitHub Action to run the Go binary
    status: proposed
    depends: [cli-status-and-gc]
    decisions: [D1, D14]
    scope:
      - >-
        Ephemeral environments never commit the D27 identity cache. The
        Action holds it in the job cache keyed by PR number; a cold cache
        is correct-but-slower, never wrong, since every entry is
        re-resolvable via its D26 fallback strategy.
      - >-
        `action.yml` fetches the matching GoReleaser binary for the
        runner's platform instead of running `node .../bin/kraai.mjs`.
      - >-
        `confirm-name` input passthrough to `--confirm-name` (D14).
      - >-
        Preserve existing behavior: refuses `pull_request_target`, sticky
        PR comment, environment-name derivation from PR context, fork-PR
        skip.
    acceptance:
      - >-
        `kraai-action-smoke` open/sync/close cycle passes against the
        rewritten Action.
    smoke: true

  - id: release-handover
    title: Hand the published `kraai` npm name from legacy-node to the Go binary
    status: proposed
    depends: [cli-status-and-gc, github-action-go]
    decisions: [D1]
    findings:
      - >-
        AUDITED 2026-09-14. `legacy-node/` is not dead code — it is the
        shipping product. npm `kraai@0.5.0` is `latest` on the registry and
        is published from `legacy-node/` by `.github/workflows/publish.yml`
        (`npm publish --provenance`, `working-directory: legacy-node`).
        `release-please-config.json` declares exactly one package,
        `legacy-node`, mapped to package-name `kraai`, and
        `.release-please-manifest.json` pins it at 0.5.0. CI runs its test
        suite and uploads its coverage. The GitHub Action still executes
        `node .../bin/kraai.mjs` out of `legacy-node/action.yml`.
      - >-
        The Go side ships nothing yet: `npm/package.json` is
        `"private": true` at version `0.0.0`. Both packages are named
        `kraai`, so the wrapper is waiting to inherit the name, not
        coexisting with it — which is why this is a handover with an
        ordering constraint, not a cleanup.
      - >-
        `.github/workflows/codeql.yml` scans `javascript-typescript`, so
        today it analyzes `legacy-node/` and nothing else. The Go code has
        never been scanned, and every green CodeQL check on a Go PR so far
        has been vacuous. Deleting `legacy-node/` without flipping the
        language leaves CodeQL scanning an empty repository, which still
        reports green.
    scope:
      - >-
        `npm/` takes over the published name: drop `"private": true`, set a
        version above the legacy line's, and point
        `release-please-config.json` at `npm/` instead of `legacy-node/`,
        carrying the `kraai` package-name and the version history with it
        so the registry sees a continuous line rather than a reset.
      - >-
        `publish.yml` publishes the Go wrapper, keeping npm provenance and
        the existing attestation steps, and gains whatever GoReleaser
        needs so the binary a freshly-installed wrapper downloads actually
        exists before the package referencing it is published. Publish
        order matters: binaries first, package second.
      - >-
        Flip `codeql.yml` to `languages: go` in the same change that
        removes `legacy-node/`, never after. Scanning the wrong tree and
        scanning no tree are both green; only one of them is noticed.
      - >-
        Preserve `internal/naming`'s provenance before deleting its
        source of truth. `doc.go`, `random.go`, `words.go`,
        `resource_test.go` and `ephemeral_test.go` all cite
        `legacy-node/src/names.mjs` and `legacy-node/test/names.test.mjs`
        as the byte-for-byte golden spec. The golden *values* are already
        vendored into the Go tests, so nothing breaks at compile time —
        but the comments become dangling references, and the reason those
        specific strings are correct is exactly what a future reader will
        need. Rewrite them to name the git revision they were ported from.
      - >-
        Drop legacy-node's CI job and its codecov upload, and remove the
        legacy release-please component and manifest entry, rather than
        leaving a pipeline pointed at a directory that no longer exists.
    acceptance:
      - >-
        `npm install -g kraai` and `npx kraai --version` on a clean machine
        fetch the Go binary and run it, at a version above the last
        JS release, with npm provenance intact.
      - >-
        A CodeQL run analyzes Go source and reports a non-zero number of
        files scanned — asserted explicitly, because "no findings" and
        "nothing analyzed" are indistinguishable from the check badge.
      - >-
        `kraai-action-smoke` passes with the Action running the Go binary
        and `legacy-node/` absent from the repository.
      - >-
        The repository contains no reference to `legacy-node/` outside git
        history.
    smoke: true

